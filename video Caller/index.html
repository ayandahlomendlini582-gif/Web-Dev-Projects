<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="header">
        <nav>
            <img src="world-wide-signal.png" class="logo">
            <ul>
                <li><img src="bell.png" class="active"></li>
                <li><img src="people.png"></li>
                <li><img src="chatting.png"></li>
                <li><img src="history.png"></li>
                <li><img src="setting.png"></li>
            </ul>
        </nav>

        <div class="container">
            <div class="top-icons">
                <img src="burger-bar.png">
                <img src="magnifying-glass.png">
            </div>
            <div class="row">
                <div class="col-1">
                    <img src="random.png" class="host">
                    <div class="controls">
                        <img src="mic.png">
                        <img src="decline.png">
                        <img src="phone-call.png" class="phone-icon">
                        <img src="chatting.png">
                        <img src="cast.png">
                    </div>
                </div>

                <div class="col-2">
                    <div class="joined">
                        <p>Live people</p>
                        <div>
                            <img src="user.png">
                            <img src="user.png">
                            <img src="download.png">
                            <img src="user.png">
                        </div>
                    </div>
                     <div class="invite">
                        <p>Invite more people</p>
                        <img src="add.png">
                    </div>   
                </div> 
            </div>
        </div>

    </div>
</body>
</html>
