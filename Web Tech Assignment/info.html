<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSVP Confirmation</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .confetti {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 9999;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #ff0;
            opacity: 0.8;
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translateY(0); }
            100% { transform: translateY(100vh); }
        }
    </style>
</head>
<body>
    <div class="confetti" id="confetti"></div>
    <div class="container">
        <h1>Thank You for Your RSVP!</h1>
        <p><strong>Name:</strong> <span id="displayName"></span></p>
        <p><strong>Email:</strong> <span id="displayEmail"></span></p>
        <p><strong>Number of Guests:</strong> <span id="displayGuests"></span></p>
        <img src="couple.jpg" alt="Mr. and Mrs. Bumble" style="width:100%; margin-top:20px;">
    </div>
    <script>
        // Display RSVP information
        document.getElementById("displayName").innerText = localStorage.getItem("rsvpName");
        document.getElementById("displayEmail").innerText = localStorage.getItem("rsvpEmail");
        document.getElementById("displayGuests").innerText = localStorage.getItem("rsvpGuests");

        // Confetti animation
        function createConfetti() {
            const confettiContainer = document.getElementById("confetti");
            for (let i = 0; i < 100; i++) {
                const confetti = document.createElement("div");
                confetti.className = "confetti-piece";
                confetti.style.left = Math.random() * 100 + "vw";
                confetti.style.animationDuration = Math.random() * 2 + 3 + "s";
                confetti.style.backgroundColor = "#" + Math.floor(Math.random() * 16777215).toString(16);
                confettiContainer.appendChild(confetti);
            }
        }

        createConfetti();
    </script>
</body>
</html>
