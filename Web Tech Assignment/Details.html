<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: sans-serif;
            font-size: 1em;
            display: flex;        
            margin: 90px;
            background-color: #f5f5f5; 
        }
        #confirmationCard {
            background-color: white;
            width: 134dvb;
            height: 295px;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            padding: 10px 20px;
            text-align: center;
        }
        img {
            margin: 2px 1px;
            width: 350px;           
            height: 280px;          
            border-radius: 58%; 
            float: left;   
        }
    </style>
</head>
<body>
        
    <div id="confirmationCard">
        <img src="mr_bumble.png" alt="Photo of mr and mrs">
        <h2>Thank you for your RSVP. Here is your Confirmation Card.</h2>
        <p>Full Name: <span id="CardName"></span></p>
        <p>Phone Number: <span id="CardNumber"></span></p>
        <p>Email: <span id="CardEmail"></span></p>
        <p>Number of Attendees: <span id="CardGuests"></span></p>
        <p>Arrival Time: <span id="CardTime"></span></p>
        <p>Menu Preference: <span id="Cardfood"></span></p>
        <p>Table Option: <span id="CardTable"></span></p>
      
    
    </div>
    <script>
        document.getElementById("CardName").innerText = localStorage.getItem("FormName");
        document.getElementById("CardNumber").innerText = localStorage.getItem("FormNumber");
        document.getElementById("CardEmail").innerText = localStorage.getItem("FormEmail");
        document.getElementById("CardGuests").innerText = localStorage.getItem("FormGuests");
        document.getElementById("CardTime").innerText = localStorage.getItem("FormArrival");
        document.getElementById("Cardfood").innerText = localStorage.getItem("FormFood");
        document.getElementById("CardTable").innerText = localStorage.getItem("FormSeating");

    </script>
</body>
</html>
