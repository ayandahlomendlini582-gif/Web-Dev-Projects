<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Notes App</title>
</head>
<body>
    
    <nav>
        <div class="logo">Menu</div>
        <ul class="nav-links">
            <button>HOME</button>
            <button>DOWNLOAD</button>
            <button>SHARE</button>
            <button>SAVE</button>
        </ul>
    </nav>

    <div id="main" class="note-form">
        <div class="subheading">
            <h3 id="subheading" data-placeholder="Enter heading here...">Hello</h3>
        </div>
        <!-- This creates the vertical red margin line -->
        <div class="margin-line"></div>

        <!-- This is where the user types -->
        <textarea  class="note-content" placeholder="HE WAS WHIPPING UP SHIT IN A KETTLE">
            
        </textarea>

    </div>
    <script src="script.js" defer></script>
</body>
</html>
