<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: beige;
            display: flexbox;
            align-items: center;
            justify-content: center;
            height: 500px;
            width: 400px;
            margin-top: 100px;
            margin-left: 600px;

        }
        #Content {
            background-color: white;
            min-width: 800px;
            max-width: 900px;
            margin: 0 auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            padding: 5px 20px;
        }
        input {
            display: block;
            width: 90%;
            margin: 10px 0;
            padding: 10px;
            border: 1px solid #ccc;
        }     
        button {
            padding: 10px 20px;
            font-size: 2.3vh;
            cursor: pointer;
            border: none;
            background-color: deepskyblue;
            margin: 20px 0px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        td {
            padding: 10px;
            border: 1px solid  #ddd;
            text-align: center;
        }
        th {
            border: none;
            width: 10%;
            padding: 2px 0px;
            background-color: #f2f2f2;
            font-size: 0.9em;
        }
        #ConvertBtn {
            color: white;
        }
    </style>
</head>
<body>
    <div id="Content">
            <h1>Exchange Rate Calculator</h1>
                <label><h3>Please Enter The Amount you want to Exchange in ZAR</h3></label>
                <input type="number" id="UserInput" name="" min="1" max="10000" placeholder="Please Enter amount in ZAR">
                
            <div id="CurrencyTable">
                <table>
                   <thead>
                    <tr>
                        <th>Currency</th>
                        <th>Today's Exchange Rate</th>
                        <th>Amount You will Receive in ZAR Currency</th>
                    </tr>
                   </thead>
                   <tbody id="Results">
                    <!-- The exchange amount and rate will be displayed here-->
                   </tbody>
                </table>
            </div>
            <button id="ConvertBtn" onclick="Calculator()">Convert Currnecy to ZAR</button>
    </div>
    <script>
        const currencies = ["USD", "EUR", "GBP", "INR", "AUD", "CAD", "JPY", "CNY", "BRL", "MXN"];
        const rates = [18.24, 19.89, 23.6, 0.12, 12.22, 13.31, 20.56, 2.51, 0.22, 3.37];

        function Calculator() {
            const UserInput = document.getElementById("UserInput").value;
            let results = document.getElementById("Results");

            results.innerHTML = " "

            if (UserInput === " " || isNaN(UserInput) || UserInput === 0){
                window.alert("Please enter the correct amount")
                return
            };

            let i = 0;
            
            for (i; i < currencies.length; i++) {
            const AmountConverted = (UserInput * rates[i]).toFixed(2);

            let row = `<tr>
                        <td>${currencies[i]}</td>
                        <td>${rates[i]}</td>
                        <td>${AmountConverted}</td>
                        </tr>`;
            results.innerHTML += row;
            };
        };
    </script>
    
</body>
</html>
