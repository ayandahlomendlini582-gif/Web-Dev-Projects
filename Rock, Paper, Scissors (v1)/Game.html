<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock, Paper, Scissors</title>
    <link rel="stylesheet" href="Game.css">
</head>
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: wheat;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        
    }
    
    #GameBackgroud {
        background-color: rgb(247, 241, 241);
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        text-align: center;
        padding-top: 0px;
        padding-left: 15px;
        padding-right: 15px;
        padding-bottom: 70px;
        width: 20%;

    }
    button {
        padding: 15px 20px;
        margin:0px 9px;
        font-size: 2.5vh;
        cursor: pointer;
        color: white;
        border: none;
        
    }
    
    #RockBtn {
        background-color: red;
    }

    #PaperBtn {
        background-color: green;
    }
    #ScissorBtn {
        background-color: yellow;
    }
    #Results {
        margin-top: 15px;
        padding-top: 15px;
        font-size: 3.2vh;
        font-family: Verdana, Geneva, Tahoma, sans-serif;
    }
</style>
<body>
    <div id="GameBackgroud">
        <div id="Content">
            <h1>Rock, Paper, Scissors</h1>
            <button id="RockBtn" onclick="PlayGame('rock')" >Rock</button>
            <button id="PaperBtn"onclick="PlayGame('paper')">Paper</button>
            <button id="ScissorBtn" onclick="PlayGame('scissors')">Scissor</button>   
        </div>
        <div>
            <p id="Results"></p>
        </div>
    </div>
    <script>
        const choices = ["paper","scissors","rock"];
        const display = document.getElementById("Results");
        function PlayGame(playerchoice) {
            const computerguess = choices[Math.floor((Math.random() * 3))];
            
            if(playerchoice === computerguess){
                display.textContent = "It's a tie!"
            }
            else if (
                (playerchoice === "rock" && computerguess == "scissor") ||
                (playerchoice === "scissors" && computerguess == "paper") ||
                (playerchoice === "paper" && computerguess == "rock")
            ) {
                display.textContent = `You win! ${playerchoice} beats ${computerguess}`;
            } else{
                display.textContent = `You lose! ${playerchoice} beats ${computerguess}`;;
            };
        };
    </script>
</body>
</html>
